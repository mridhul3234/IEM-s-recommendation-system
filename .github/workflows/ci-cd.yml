name: AcousticSearch CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test Suite (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Pytest Test Suite
        env:
          APP_ENV: testing
          GEMINI_API_KEY: ""
          SUPABASE_URL: ""
          SUPABASE_KEY: ""
        run: |
          pytest -v --tb=short

  frontend-build:
    name: Frontend Static Build Check (Node.js 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Astro Static Site
        run: npm run build

  deploy-staging:
    name: Deploy to Staging Environment
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Staging Deployment Notification
        run: |
          echo "🚀 Staging deployment triggered on merge to main."
          echo "Run staging health check: GET /health"

  deploy-production:
    name: Deploy to Production Environment
    needs: [backend-test, frontend-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Production Deployment Notification
        run: |
          echo "🎉 Production release deployment triggered on tag ${GITHUB_REF#refs/tags/}."
          echo "Verifying health check: GET /health"
