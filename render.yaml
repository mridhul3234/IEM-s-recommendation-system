# Render Blueprint Configuration for AcousticSearch
# https://render.com/docs/blueprint-spec

services:
  # 1. Python FastAPI Backend Service
  - type: web
    name: acousticsearch-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn acousticsearch.server:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RATE_LIMIT_MAX_CLIENTS
        value: "10000"

  # 2. Astro Frontend Static Site
  - type: web
    name: acousticsearch-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: acousticsearch-backend
          property: url
